name: Abrar-Notebooks-Tools

services:
  Abrar-Notebooks-Tools:
    image: abrar:latest
    ports:
      - "82:80"
    container_name: Abrar-Tools
    hostname: Abrar-Tools-MIH
    restart: unless-stopped

    healthcheck:
      test:
        - CMD-SHELL
        - >
          if ! command -v curl >/dev/null 2>&1;
          then apk add --no-cache curl || exit 1;
          fi;
          curl -fsS http://127.0.0.1:80/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - MIH-Lab

networks:
  MIH-Lab:
    external: true
