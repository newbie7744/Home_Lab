services:
  MEMOS:
    image: neosmemo/memos:stable
    container_name: Memos
    healthcheck:
      test:
        - CMD-SHELL
        - >
          if ! command -v curl >/dev/null 2>&1;
          then apk add --no-cache curl || exit 1;
          fi;
          curl -fsS http://127.0.0.1:5230/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - MIH-Lab
    hostname: MIH-MEMOS
    ports:
      - "5230:5230"
    volumes:
      - /home/mih/Docker-Config/Memos:/var/opt/memos
    environment:
      MEMOS_PORT: ${MEMOS_PORT}
      MEMOS_DRIVER: ${MEMOS_DRIVER}
     # MEMOS_INSTANCE_URL: ${MEMOS_DOMAIN_NAME}
      MEMOS_LOG_LEVEL: ${MEMOS_LOG}
      MEMOS_DSN: ${MEMOS_DB_DSN}
      MEMOS_ADDR: ${MEMOS_ADDR}
    depends_on:
      - MEMOS-DB

  MEMOS-DB:
    image: postgres:16
    container_name: Memos-Postgres
    healthcheck:
         test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
         interval: 10s
         timeout: 5s
         retries: 5
         start_period: 30s
    restart: unless-stopped
    hostname: MIH-MEMOS-DB
    volumes:
      - postgres_memo:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${MEMOS_DB}
      POSTGRES_USER: ${MEMOS_DB_USER}
      POSTGRES_PASSWORD: ${MEMOS_DB_PASSWORD}
    networks:
      - MIH-Lab
networks:
   MIH-Lab:
     external: true
volumes:
   postgres_memo:
      name: postgres_memo
