services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: Home-Page
    restart: unless_stopped

    healthcheck:
      test:
        - CMD-SHELL
        - >
          if ! command -v curl >/dev/null 2>&1;
          then apk add --no-cache curl || exit 1;
          fi;
          curl -fsS http://127.0.0.1:3000/ >/dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - MIH-Lab

    ports:
      - "3000:3000"

    volumes:
      - /home/mih/Docker-Config/Homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/mih/Docker-Config/Homepage/icons:/app/public/icons
      - /home/mih/Docker-Config/Homepage/images:/app/public/images

    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_MASTER_DOMAIN}
      TZ: ${INDIA_TZ}

networks:
  MIH-Lab:
    external: true
