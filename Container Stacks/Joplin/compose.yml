services:
    Joplin-DB:
        image: postgres:16
        hostname: Joplin-DB
        container_name: Joplin-DB
        profiles:
            - server
        volumes:
            - Joplin-DB-data:/var/lib/postgresql/data
        networks:
            - MIH-Lab
        restart: unless-stopped
        environment:
            - POSTGRES_PASSWORD=${JOPLIN_POSTGRES_PASSWORD}
            - POSTGRES_USER=${JOPLIN_POSTGRES_USER}
            - POSTGRES_DB=${JOPLIN_POSTGRES_DB}

    Joplin-Notes:
        image: joplin/server:latest
        hostname: Joplin-Notes
        container_name: Joplin-Notes
        profiles:
            - server
        depends_on:
            - Joplin-DB
        ports:
            - "45759:45759"
        networks:
            - MIH-Lab
        restart: unless-stopped
        environment:
            - APP_PORT=45759
            - APP_BASE_URL=${JOPLIN_APP_BASE_URL}
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=${JOPLIN_POSTGRES_PASSWORD}
            - POSTGRES_DATABASE=${JOPLIN_POSTGRES_DB}
            - POSTGRES_USER=${JOPLIN_POSTGRES_USER}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_HOST=${JOPLIN_DB_HOST}

volumes:
    Joplin-DB-data:
        name: Joplin-DB-data

networks:
    MIH-Lab:
        external: true
